[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "lit-yolo"
version = "0.1.0"
description = "YOLO-OBB Training with PyTorch Lightning"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "Borda", email = "6035284+Borda@users.noreply.github.com"},
]
keywords = ["yolo", "object-detection", "pytorch-lightning", "obb", "oriented-bounding-box"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pytorch-lightning>=2.0.0,<2.6.0",
    "ultralytics",
    "jsonargparse[signatures]",
    "torchmetrics[detection]",
    "opencv-python>=4.5.0",
    "numpy>=1.20.0",
    "torch>=1.13.0",
    "pyyaml>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/Borda/lightning-YOLOs"
Repository = "https://github.com/Borda/lightning-YOLOs"
Issues = "https://github.com/Borda/lightning-YOLOs/issues"

[project.scripts]
lit-yolo = "lit_yolo.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lit_yolo*"]

[tool.black]
line-length = 120
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]
